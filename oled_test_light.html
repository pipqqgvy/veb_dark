<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>OLED test light</title>
<style>
:root{--bg:#ffffff;--fg:#111111;--bd:#cccccc;--mu:#555555;--ac:#0b57d0;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 sans-serif;-webkit-tap-highlight-color:transparent}
#bar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:12px;z-index:5}
#sp{width:14px;height:14px;border:2px solid var(--ac);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:44px 0 0;background:var(--bg);z-index:4;padding:16px;overflow:auto}
#ov button,.card button{background:var(--bg);color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:8px 14px;font-size:14px}
#ov p{margin:10px 0;color:var(--mu)}
#feed{padding:54px 10px 20px}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:12px;background:var(--bg)}
.card header{display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:16px}.tag{color:var(--mu);font-size:12px}
.card p{margin:8px 0;color:var(--fg)}.card.x p{font-size:16px}
.media{height:70px;border-radius:8px;margin:8px 0}
.card ul{margin:6px 0 6px 18px;color:var(--mu)}
.bar{height:6px;border:1px solid var(--bd);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:30%;background:var(--ac);transition:width 1s}
.card footer{display:flex;gap:8px}.card.on button:first-child{background:var(--ac);color:var(--bg)}
</style>
</head>
<body>
<div id="bar"><span id="sp"></span><span id="st">ожидание</span></div>
<div id="ov">
<h2>Тест OLED: тема light</h2>
<p>Перед стартом: режим полёта, автояркость выкл., яркость вручную (одинаково в обоих тестах), зарядка отключена, 60 Гц, фоновые приложения закрыты.</p>
<p id="chk"></p>
<button id="go">Старт</button>
</div>
<main id="feed"></main>
<script>
(function(){
var Q=new URLSearchParams(location.search),MIN=+(Q.get('minutes')||60),CARDS=+(Q.get('cards')||300),SPEED=+(Q.get('speed')||120),MEDIA=Q.get('media')!=='0';
function R(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=R(20261108),W='система адресное хранение энергия экран пиксель яркость цвет батарея заряд тема интерфейс контент склад данные расход мощность измерение режим время сеть'.split(' ');
function words(n){var s=[];for(var i=0;i<n;i++)s.push(W[Math.floor(rnd()*W.length)]);return s.join(' ')}
function el(t,c,x,p){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
var feed=document.getElementById('feed');
for(var i=0;i<CARDS;i++){
 var a=el('article','card',null,feed),h=el('header',0,0,a);
 el('h3',0,'Карточка '+(i+1)+': '+words(2),h);el('span','tag','#'+Math.floor(rnd()*9999),h);
 el('p',0,words(28),a);
 var m=el('div','media',null,a);
 if(MEDIA)m.style.background='linear-gradient(135deg,hsl('+Math.floor(rnd()*360)+',70%,50%),hsl('+Math.floor(rnd()*360)+',70%,35%))';
 var u=el('ul',0,0,a);for(var k=0;k<3;k++)el('li',0,words(4),u);
 var b=el('div','bar',0,a);el('i',0,0,b).style.width=Math.floor(rnd()*100)+'%';
 var f=el('footer',0,0,a);el('button',0,'Нравится',f);el('button',0,'Развернуть',f);
}
var N=document.getElementsByTagName('*').length,st=document.getElementById('st'),chk=document.getElementById('chk');
var bat=null,lock=null,run=false,t0=0,log=[],cards=feed.children;
if(navigator.getBattery)navigator.getBattery().then(function(x){bat=x;chk.textContent='Батарея: '+Math.round(x.level*100)+'%, зарядка: '+(x.charging?'ДА (отключите!)':'нет')+' | DOM: '+N+' | WakeLock: '+('wakeLock' in navigator?'есть':'НЕТ')});
else chk.textContent='Battery API недоступен | DOM: '+N;
function wl(){if(!('wakeLock' in navigator))return;navigator.wakeLock.request('screen').then(function(l){lock=l}).catch(function(){})}
document.addEventListener('visibilitychange',function(){if(run&&document.visibilityState==='visible')wl()});
function snap(){var s=Math.round((Date.now()-t0)/1000);log.push([s,bat?bat.level:'',bat?(bat.charging?1:0):'',lock&&!lock.released?1:0,N].join(','))}
function save(){var csv='sec,level,charging,wakelock,dom\n'+log.join('\n');try{localStorage.setItem('oled_light',csv)}catch(e){}
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='oled_light.csv';a.click()}
var dir=1,last=0,lastY=-1;
function frame(ts){if(!run)return;var dt=last?(ts-last)/1000:0;last=ts;
 var max=document.documentElement.scrollHeight-innerHeight,y=scrollY+dir*SPEED*dt;
 if(y>=max){y=max;dir=-1}else if(y<=0){y=0;dir=1}window.scrollTo(0,y);requestAnimationFrame(frame)}
function done(){run=false;clearInterval(t1);clearInterval(t2);clearInterval(t3);snap();st.textContent='ГОТОВО';if(lock)lock.release();save()}
var t1,t2,t3;
document.getElementById('go').onclick=function(){
 document.getElementById('ov').style.display='none';
 try{document.documentElement.requestFullscreen()}catch(e){}
 wl();run=true;t0=Date.now();window.scrollTo(0,0);snap();
 t1=setInterval(function(){var s=(Date.now()-t0)/1000;st.textContent=Math.floor(s/60)+'/'+MIN+' мин | '+(bat?Math.round(bat.level*100)+'%':'—');if(s>=MIN*60)done()},1000);
 t2=setInterval(snap,60000);
 t3=setInterval(function(){var c=cards[Math.floor(rnd()*cards.length)],r=rnd();
  if(r<.5)c.classList.toggle('on');else if(r<.8)c.classList.toggle('x');else c.querySelector('i').style.width=Math.floor(rnd()*100)+'%'},5000);
 requestAnimationFrame(frame)};
})();
</script>
</body>
</html>
